<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ProPayroll Office OS • Login</title>
  <link rel="stylesheet" href="assets/css/styles.css"/>
</head>
<body class="login-body">
  <main class="login-card">
    <form id="loginForm" class="form-grid">
      <input class="input" name="email" type="email" autocomplete="username" placeholder="Email (@doggzi.com)" aria-label="Email" required />
      <input class="input" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required />
      <button class="btn primary" type="submit">Sign In</button>
    </form>
    <div class="card" style="margin-top:16px;">
      <div class="hd">
        <h3>Access Rules</h3>
        <span class="hint">Doggzi Office OS</span>
      </div>
      <ul class="help-list">
        <li>Only @doggzi.com emails can register.</li>
        <li>New signups remain in PENDING_APPROVAL until Superuser approval.</li>
        <li>Superuser: abhiyash@doggzi.com • Use Maker/Checker workflow.</li>
      </ul>
    </div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/pages/login.js" defer></script>
</body>
</html>
