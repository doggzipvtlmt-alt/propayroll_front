<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doggzi HRMS - Login</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>HRMS Secure Login</h1>
      <p class="subtext">Authorized access only. Use official credentials.</p>
      <form id="loginForm">
        <label>
          Email
          <input type="email" name="email" required placeholder="name@doggzi.com" />
        </label>
        <label>
          Password
          <input type="password" name="password" required placeholder="••••••••" />
        </label>
        <div class="actions">
          <a href="request-access.html">Request Access</a>
          <button type="submit">Sign In</button>
        </div>
      </form>
      <p class="small" id="loginStatus"></p>
    </div>
  </div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/pages/login.js"></script>
</body>
</html>
