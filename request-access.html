<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doggzi HRMS - Request Access</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Access Request</h1>
      <p class="subtext">Submit a registration request for review and approval.</p>
      <form id="requestForm">
        <label>
          Full Name
          <input type="text" name="fullName" required />
        </label>
        <label>
          Official Email (@doggzi.com)
          <input
            type="email"
            name="email"
            required
            placeholder="name@doggzi.com"
            pattern="^[a-zA-Z0-9._%+-]+@doggzi\\.com$"
          />
        </label>
        <label>
          Phone Number
          <input type="tel" name="phone" required placeholder="9876543210" pattern="^[6-9]\\d{9}$" />
        </label>
        <label>
          Role Requested
          <select name="requestedRole" required>
            <option value="" disabled selected>Select a role</option>
            <option value="HR">HR</option>
            <option value="MD">MD</option>
            <option value="EMPLOYEE">EMPLOYEE</option>
            <option value="FINANCE">FINANCE</option>
          </select>
        </label>
        <label>
          Department (optional)
          <input type="text" name="department" placeholder="e.g., Finance, Operations" />
        </label>
        <div class="actions">
          <a href="login.html">Back to Login</a>
          <button type="submit">Submit Request</button>
        </div>
      </form>
      <p class="small" id="requestStatus"></p>
      <p class="small">
        Requests are verified against company policy and require approval before account activation.
      </p>
    </div>
  </div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/pages/request-access.js"></script>
</body>
</html>
